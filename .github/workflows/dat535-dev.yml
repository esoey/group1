name: DAT535 — Dev Pipeline

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  run-dev:
    name: Run Dev Pipeline
    runs-on: self-hosted
    environment: dev
    env:
      DAT535_ENV: dev
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      STATSBOMB_DATA_DIR: /home/ubuntu/group1/open-data
      DAT535_OUTPUT_DIR: /home/ubuntu/football-data/dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Football Pipeline
        working-directory: project
        run: |
          source ~/football-env/bin/activate
          unset SPARK_HOME

          echo "=== Running Dev Pipeline ==="
          python main.py
