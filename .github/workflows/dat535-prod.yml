name: DAT535 — Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: self-hosted
    environment: main
    env:
      DAT535_ENV: prod
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      STATSBOMB_DATA_DIR: /home/ubuntu/group1/open-data
      DAT535_OUTPUT_DIR: /home/ubuntu/football-data/prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update Statsbomb data
        working-directory: /home/ubuntu/group1/open-data
        run: git pull --ff-only

      - name: Run Production Pipeline
        working-directory: project
        run: |
          source ~/football-env/bin/activate
          unset SPARK_HOME
          echo "=== Running Production Pipeline ==="
          python main.py
